name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv & install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: pwsh
        run: .venv\Scripts\python.exe build.py

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\music_downloader\* -DestinationPath music_downloader-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: music_downloader-win-x64
          path: music_downloader-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv & install deps
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: .venv/bin/python build.py

      - name: Package zip
        run: |
          cd dist/music_downloader
          zip -r ../../music_downloader-linux-x64.zip ./

      - uses: actions/upload-artifact@v4
        with:
          name: music_downloader-linux-x64
          path: music_downloader-linux-x64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/music_downloader-win-x64/music_downloader-win-x64.zip
            artifacts/music_downloader-linux-x64/music_downloader-linux-x64.zip
          generate_release_notes: true
