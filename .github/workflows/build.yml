name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check api/ncm critical files
        shell: pwsh
        run: |
          $required = @(
            "api/ncm/app.js",
            "api/ncm/index.js",
            "api/ncm/run.js",
            "api/ncm/package.json",
            "api/ncm/util/index.js",
            "api/ncm/util/request.js",
            "api/ncm/module/login.js",
            "api/ncm/module/song_url.js",
            "api/ncm/module/song_download_url.js",
            "api/ncm/data/china_ip_ranges.txt",
            "api/ncm/data/deviceid.txt"
          )
          $missing = @()
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Host "[ERROR] Missing api/ncm/ critical files:"
            $missing | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }
          $modCount = (Get-ChildItem "api/ncm/module/*.js").Count
          if ($modCount -lt 50) {
            Write-Host "[ERROR] api/ncm/module/ has only $modCount JS files (expected >50), source files may be incomplete"
            exit 1
          }
          Write-Host "[OK] api/ncm/ critical files check passed ($modCount JS files in module dir)"

      - name: Create venv & install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: pwsh
        run: .venv\Scripts\python.exe build.py

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\music_downloader\* -DestinationPath music_downloader-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: music_downloader-win-x64
          path: music_downloader-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check api/ncm critical files
        run: |
          set -e
          required="
            api/ncm/app.js
            api/ncm/index.js
            api/ncm/run.js
            api/ncm/package.json
            api/ncm/util/index.js
            api/ncm/util/request.js
            api/ncm/module/login.js
            api/ncm/module/song_url.js
            api/ncm/module/song_download_url.js
            api/ncm/data/china_ip_ranges.txt
            api/ncm/data/deviceid.txt
          "
          missing=""
          for f in $required; do
            if [ ! -f "$f" ]; then
              missing="$missing  - $f\n"
            fi
          done
          if [ -n "$missing" ]; then
            printf "[ERROR] Missing api/ncm/ critical files:\n$missing"
            exit 1
          fi
          modCount=$(ls api/ncm/module/*.js 2>/dev/null | wc -l)
          if [ "$modCount" -lt 50 ]; then
            echo "[ERROR] api/ncm/module/ has only $modCount JS files (expected >50), source files may be incomplete"
            exit 1
          fi
          echo "[OK] api/ncm/ critical files check passed ($modCount JS files in module dir)"

      - name: Create venv & install deps
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: .venv/bin/python build.py

      - name: Package zip
        run: |
          cd dist/music_downloader
          zip -r ../music_downloader-linux-x64.zip ./

      - uses: actions/upload-artifact@v4
        with:
          name: music_downloader-linux-x64
          path: music_downloader-linux-x64.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/music_downloader-win-x64/music_downloader-win-x64.zip
            artifacts/music_downloader-linux-x64/music_downloader-linux-x64.zip
          generate_release_notes: true
