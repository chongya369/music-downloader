name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv & install deps
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: pwsh
        run: .venv\Scripts\python.exe build.py

      - name: Package zip
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          Compress-Archive -Path dist\music_downloader\* -DestinationPath "deen-music-downloader-v${v}-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: deen-music-downloader-win-x64
          path: deen-music-downloader-v*-win-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build (Debian 12)
    runs-on: ubuntu-latest
    container: debian:12
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python env
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip zip

      - name: Create venv & install deps
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: .venv/bin/python build.py

      - name: Package zip
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          cd dist/music_downloader
          zip -r ../../deen-music-downloader-v${VERSION}-linux-x64.zip ./

      - uses: actions/upload-artifact@v4
        with:
          name: deen-music-downloader-linux-x64
          path: deen-music-downloader-v*-linux-x64.zip
          if-no-files-found: error

  build-fnos:
    name: Build (fnOS .fpk)
    runs-on: ubuntu-latest
    container: debian:12
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Python env
        run: |
          apt-get update
          apt-get install -y python3 python3-venv python3-pip zip

      - name: Create venv & install deps
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pyinstaller

      - name: Build Linux binary
        run: .venv/bin/python build.py

      - name: Assemble fpk package
        run: |
          # 1) 仓库内 fpk 源（manifest/config/cmd/ui 图标等）-> fpk/
          mkdir -p fpk
          cp -r fnos/. fpk/
          # manifest 版本号以 version.txt 为唯一来源，CI 组装时覆盖
          VERSION=$(tr -d '[:space:]' < version.txt)
          sed -i "s/^version[[:space:]]*=.*/version = ${VERSION}/" fpk/manifest
          # 2) PyInstaller 产物 -> fpk/app/server/
          mkdir -p fpk/app/ui/images fpk/cmd fpk/config
          cp -r dist/music_downloader/. fpk/app/server/
          # 全部生命周期脚本需可执行位（git 检出不保留 Windows 提交的执行位）
          chmod +x fpk/cmd/*
          [ -f fpk/app/server/music_downloader ] && chmod +x fpk/app/server/music_downloader
          # 3) 校验 wizard/ 目录存在（fnpack 打包检查要求）
          test -d fpk/wizard || (mkdir -p fpk/wizard)

      - name: Build .fpk with fnpack
        run: |
          # 使用仓库内置的官方 fnpack 1.2.3（SHA256 与 static2.fnnas.com 发布版一致），
          # 避免外部下载源失效；Windows 提交丢失执行位，需先 chmod
          chmod +x fnpack-linux-amd64
          ./fnpack-linux-amd64 build --directory fpk
          # fnpack 输出名跟随 manifest appname（deen-music-downloader.fpk），统一改为带版本号
          VERSION=$(tr -d '[:space:]' < version.txt)
          mv *.fpk "deen-music-downloader-v${VERSION}.fpk"

      - uses: actions/upload-artifact@v4
        with:
          name: deen-music-downloader-fnos
          # fnpack 将 .fpk 输出到工作目录（仓库根），而非 --directory 指定目录
          path: "*.fpk"
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-fnos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 调试输出：打印 artifact 实际内部路径（曾出现 fnos artifact 内部
      # 路径与预期不符导致 glob 失配，此步骤用于直接暴露真实结构）
      - name: List downloaded artifacts
        run: find artifacts -type f -exec ls -lh {} \;

      - uses: softprops/action-gh-release@v2
        with:
          # 仅上传两个 zip；.fpk 由后续步骤单独上传（fail-loud）
          files: |
            artifacts/deen-music-downloader-win-x64/deen-music-downloader-v*-win-x64.zip
            artifacts/deen-music-downloader-linux-x64/deen-music-downloader-v*-linux-x64.zip
          generate_release_notes: true

      # fpk 单独上传：softprops 的 files glob 失配时仅打 warning 不报错，
      # 曾导致 .fpk 静默缺失；此处用 find 定位（不受 artifact 内部嵌套
      # 路径影响），找不到文件直接让步骤失败
      - name: Upload .fpk to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fpk=$(find artifacts/deen-music-downloader-fnos -name '*.fpk' -type f | head -n 1)
          if [ -z "$fpk" ]; then
            echo "ERROR: no .fpk found under artifacts/deen-music-downloader-fnos/"
            exit 1
          fi
          echo "Uploading: $fpk"
          gh release upload "$GITHUB_REF_NAME" "$fpk" --repo "$GITHUB_REPOSITORY" --clobber