<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改密码 - Deen音乐下载器</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/5.3.2/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='vendor/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pwd-card {
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: none;
            border-radius: 12px;
        }
        .pwd-header {
            text-align: center;
            padding: 24px 16px 8px;
        }
        .pwd-header i {
            font-size: 48px;
            color: #667eea;
        }
        .pwd-header h4 {
            margin: 12px 0 4px;
            color: #333;
        }
        .pwd-header small {
            color: #999;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.2);
        }
        .btn-primary {
            background-color: #667eea;
            border-color: #667eea;
        }
        .btn-primary:hover {
            background-color: #5568d3;
            border-color: #5568d3;
        }
    </style>
</head>
<body>
    <div class="card pwd-card">
        <div class="pwd-header">
            <i class="bi bi-shield-lock"></i>
            <h4>修改密码</h4>
            <small>当前用户：{{ user.username }}</small>
        </div>
        <div class="card-body p-4">
            {% if user.must_change_password %}
            <div class="alert alert-warning py-2" role="alert">
                <i class="bi bi-exclamation-triangle"></i>
                当前使用的是默认密码，必须修改后才能继续使用。
                <div class="small mt-2 text-muted">
                    若您是从旧版本升级而来，且发现原有账号、歌单或下载记录丢失，
                    说明数据目录未跟随升级。请勿修改密码，先停止本应用并恢复旧数据目录
                   （downloads.db 所在目录）后再启动。
                </div>
            </div>
            {% endif %}
            {% if error %}
            <div class="alert alert-danger py-2" role="alert">
                <i class="bi bi-exclamation-triangle"></i> {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="{{ url_for('views.change_password') }}">
                <div class="mb-3">
                    <label class="form-label">旧密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" name="old_password" required
                               placeholder="请输入旧密码">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" name="new_password" required minlength="6"
                               placeholder="至少 6 位">
                        <button class="btn btn-outline-secondary" type="button" id="toggle-pwd" tabindex="-1">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">确认新密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                        <input type="password" class="form-control" name="confirm_password" required minlength="6"
                               placeholder="再次输入新密码">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-check-lg"></i> 修改密码
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='vendor/bootstrap/5.3.2/bootstrap.bundle.min.js') }}"></script>
    <script>
        // 密码显示/隐藏切换
        document.getElementById("toggle-pwd").addEventListener("click", function() {
            const pwd = document.querySelector("input[name='new_password']");
            const icon = this.querySelector("i");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.className = "bi bi-eye-slash";
            } else {
                pwd.type = "password";
                icon.className = "bi bi-eye";
            }
        });
    </script>
</body>
</html>
