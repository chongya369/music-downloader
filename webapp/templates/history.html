{% extends "base.html" %}
{% block title %}下载历史 - 网易云音乐下载器{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-clock-history"></i> 下载历史</h4>

<!-- 筛选栏 -->
<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small">状态</label>
                <select class="form-select form-select-sm" id="filter-status">
                    <option value="">全部</option>
                    <option value="success">成功</option>
                    <option value="failed">失败</option>
                    <option value="skipped">已下载</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label small">搜索</label>
                <input type="text" class="form-control form-control-sm" id="filter-keyword" placeholder="歌名或歌手">
            </div>
            <div class="col-md-3">
                <label class="form-label small">每页</label>
                <select class="form-select form-select-sm" id="filter-perpage">
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-primary btn-sm" id="btn-search"><i class="bi bi-search"></i> 查询</button>
            </div>
        </div>
    </div>
</div>

<!-- 失败重试栏（仅失败筛选时显示） -->
<div class="alert alert-warning d-none" id="retry-bar">
    <div class="d-flex justify-content-between align-items-center">
        <span><i class="bi bi-exclamation-triangle"></i> 当前筛选结果包含失败歌曲</span>
        <button class="btn btn-warning btn-sm" id="btn-retry-all">
            <i class="bi bi-arrow-clockwise"></i> 全部重试
        </button>
    </div>
</div>

<!-- 列表 -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>歌曲</th>
                        <th>歌手</th>
                        <th>来源歌单</th>
                        <th width="80">音质</th>
                        <th width="100">大小</th>
                        <th width="150">下载时间</th>
                        <th width="80">状态</th>
                        <th width="120">操作</th>
                    </tr>
                </thead>
                <tbody id="song-tbody">
                    <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- 分页 -->
        <nav class="mt-3">
            <ul class="pagination justify-content-center" id="pagination"></ul>
        </nav>
    </div>
</div>

<!-- 失败原因弹窗 -->
<div class="modal fade" id="fail-reason-modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="bi bi-exclamation-triangle text-danger"></i> 失败原因
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">
                    <strong>歌曲：</strong><span id="fail-song-name"></span>
                </div>
                <div class="mb-3">
                    <strong>歌手：</strong><span id="fail-song-artists"></span>
                </div>
                <hr>
                <div class="mb-2"><strong>失败原因：</strong></div>
                <div class="alert alert-danger mb-0" id="fail-reason-text" style="white-space: pre-wrap; word-break: break-all;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">我知道了</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/history.js') }}"></script>
{% endblock %}
