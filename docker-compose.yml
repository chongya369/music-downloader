# Compose file for Deen 音乐下载器
#
# 用法：
#   docker compose up -d
#   浏览器打开 http://<host-ip>:45600
#
# 默认账号/密码：admin / admin123 （首次登录后请立即修改）
#
# 数据持久化：
#   - /data：SQLite（账号/歌单/任务/设置） + 日志 + ncm-api 临时缓存
#   - /app/downloads（或挂载到任意宿主机路径）：下载的音乐文件
#   - /app/logs 日志文件（webapp.log）其他日志在/data目录
#
# 高级用法：
#   - 改端口：编辑下方 ports 映射，或通过环境变量 WEB_PORT=*:45601 改监听地址
#     （注意 web_port 是 host:port 字符串，需配合 --data-dir 重启）
#   - 改时区：通过 TZ 环境变量传入（容器默认 UTC；设 TZ=Asia/Shanghai 让日志/任务调度
#     使用本地时间）
#   - 升级镜像：docker compose pull && docker compose up -d
#   - 自定义源：build.args 段传入 APT_MIRROR / PIP_INDEX_URL，海外用户可设回
#     APT_MIRROR=deb.debian.org  PIP_INDEX_URL=https://pypi.org/simple

name: deen-music-downloader

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # 镜像源：默认走国内源（apt 阿里云 / pip 阿里云）以加速国内构建。
      # 海外用户改成下面注释里的值即可恢复官方源：
      args:
        APT_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
        # APT_MIRROR: deb.debian.org
        # PIP_INDEX_URL: https://pypi.org/simple
    image: chongya369/deen-music-downloader:latest
    container_name: deen-music-downloader
    restart: unless-stopped

    # Web UI: 宿主机 :45600 → 容器 :45600
    # 端口映射采用短语法；如需绑定到特定宿主机 IP，请改为 "127.0.0.1:45600:45600"。
    ports:
      - "45600:45600"

    # 数据持久化
    volumes:
      # SQLite + 日志 + ncm-api 临时缓存 → 命名卷（由 docker 管理生命周期）
      - ./deen-data:/data
      # 下载文件 → 命名卷，便于备份/迁移。
      # 若希望直接在宿主机浏览音乐，可改为：
      #   - /path/on/host:/app/downloads
      - ./deen-downloads:/app/downloads
      - ./deen-logs:/app/logs
    # 环境变量（全部可选）
    environment:
      # 应用数据目录（与 Dockerfile 中 ENV APP_DATA_DIR=/data 保持一致，
      # 此处显式再写一遍便于后续修改默认位置）。
      APP_DATA_DIR: /data
      # 时区：日志时间戳 + APScheduler 触发时刻 + 数据库默认时间字段
      TZ: Asia/Shanghai
      # Flask session 签名密钥（覆盖默认值；生产环境务必改成强随机字符串）
      # FLASK_SECRET_KEY: "please-change-me-to-a-long-random-string"
      # 自定义 Web 监听地址（默认 *:45600；改这里需要改 ports 一起）
      # WEB_PORT: "*:45600"

    # 健康检查镜像内 HEALTHCHECK — 这里仅覆写间隔/超时等可选参数
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:45600/login', timeout=2); sys.exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # 资源限制（按需调整；默认值适合 NAS / 小型 VPS）
    deploy:
      resources:
        limits:
          # Flask 进程 + 三个 Go API 子进程 + 临时下载缓冲。
          # 三平台 API 高峰期合计可占 ~500 MB；这里给 1 GB 留余量。
          memory: 1G
        reservations:
          memory: 256M

    # 网络模式默认 bridge 即可；若与其他容器共享同一网络，可改为
    #   network_mode: "service:reverse-proxy"
    # 并删除 ports，由反代容器（如 caddy / nginx）对外暴露。

    # 日志（防止容器日志占满磁盘）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

